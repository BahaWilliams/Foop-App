# Server
server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: FoopApp

  # Mail config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # MySQL config
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/food_app}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

secretJwtToken: ${JWT_SECRET:change-this-dev-secret}

base:
  payment:
    link: ${BASE_PAYMENT_LINK:http://localhost:3000/pay?orderid=}

frontend:
  base:
    url: ${FRONTEND_BASE_URL:http://localhost:3000}

# Stripe Config
stripe:
  api:
    public:
      key: ${STRIPE_PUBLIC_KEY:}
    secret:
      key: ${STRIPE_SECRET_KEY:}

# AWS Config
aws:
  s3:
    region: ${AWS_REGION:us-east-1}
    bucket: ${AWS_S3_BUCKET:foop-app-dev}
  accessKeyId: ${AWS_ACCESS_KEY_ID:}
  secretKey: ${AWS_SECRET_ACCESS_KEY:}